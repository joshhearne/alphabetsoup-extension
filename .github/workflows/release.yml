name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.2 (no leading v)'
        required: true
      targets:
        description: 'Comma-separated stores to publish. Use this to retry a single store that failed while the others already shipped the version.'
        required: false
        default: chrome,edge,firefox

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Resolve version and targets
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
            TARGETS="${INPUT_TARGETS}"
          else
            VERSION="${GITHUB_REF_NAME}"
            TARGETS="chrome,edge,firefox"
          fi
          VERSION="${VERSION#v}"
          # Chrome, Edge and AMO all accept x.y.z; reject anything else so the
          # three stores can never diverge on a version one of them rejects.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not x.y.z"
            exit 1
          fi
          if ! printf '%s' "$TARGETS" | grep -Eq '^(chrome|edge|firefox)(,(chrome|edge|firefox))*$'; then
            echo "::error::Targets '$TARGETS' must be a comma-separated subset of chrome,edge,firefox"
            exit 1
          fi
          JSON=$(printf '%s' "$TARGETS" | jq -Rc 'split(",")')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "targets=$JSON" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION to $TARGETS."

  publish:
    name: Publish ${{ matrix.target }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # One store rejecting a build must not stop the other two.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.version.outputs.targets) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' public/manifest.json > manifest.tmp
          mv manifest.tmp public/manifest.json
          npm pkg set version="$VERSION"

      - name: Build extension
        run: npm run build:${{ matrix.target }}

      - name: Verify built manifest version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          BUILT=$(jq -r .version dist-${{ matrix.target }}/manifest.json)
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::dist-${{ matrix.target }}/manifest.json is $BUILT, expected $VERSION"
            exit 1
          fi

      - name: Package extension
        run: |
          cd dist-${{ matrix.target }}
          zip -r ../alphabetsoup-${{ matrix.target }}.zip . --exclude "*.map"

      - name: Package source for AMO review
        if: matrix.target == 'firefox'
        # Tracked files from the working tree, not `git archive HEAD`, so the
        # stamped version is what reviewers build from.
        run: git ls-files -z | xargs -0 zip -q alphabetsoup-source.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphabetsoup-${{ matrix.target }}-${{ needs.version.outputs.version }}
          path: alphabetsoup-${{ matrix.target }}.zip

      - name: Publish to Chrome Web Store
        if: matrix.target == 'chrome'
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: alphabetsoup-chrome.zip
          extension-id: loekomefinlhckgbbnbfhibnogapoigo
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}

      - name: Publish to Edge Add-ons
        if: matrix.target == 'edge'
        uses: wdzeng/edge-addon@v2.1.1
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: alphabetsoup-edge.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}

      - name: Resolve AMO release notes
        if: matrix.target == 'firefox'
        id: notes
        # AMO rejects a blank release_notes with 400, so this must always
        # produce something. Annotated tag message if there is one, else a
        # generated line pointing at the GitHub release.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          NOTES=""
          # Only an annotated tag has its own message. For a lightweight tag
          # git falls back to the commit message, which is not release notes.
          if [ "${{ github.event_name }}" = "push" ] && \
             [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
            NOTES=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")
          fi
          NOTES=$(printf '%s' "$NOTES" | sed -e 's/[[:space:]]*$//')
          if [ -z "$NOTES" ]; then
            NOTES="AlphabetSoup $VERSION. Release details: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          fi
          {
            echo "notes<<AMO_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "AMO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Firefox Add-ons
        if: matrix.target == 'firefox'
        uses: browser-actions/release-firefox-addon@v0.2.1
        with:
          addon-id: alphabetsoup@hearnetech.com
          addon-path: alphabetsoup-firefox.zip
          source-path: alphabetsoup-source.zip
          channel: listed
          compatibility-firefox-min: '115.0'
          # Must match the repo LICENSE and the slug already on the AMO
          # listing; the action sends license=undefined if this is omitted.
          license: MIT
          release-note: ${{ steps.notes.outputs.notes }}
          auth-api-issuer: ${{ secrets.AMO_API_KEY }}
          auth-api-secret: ${{ secrets.AMO_API_SECRET }}
