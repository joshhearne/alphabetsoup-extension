name: Deploy to Firefox Add-ons

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build extension
        run: npm ci && npm run build:firefox

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' dist-firefox/manifest.json > tmp.json && mv tmp.json dist-firefox/manifest.json

      - name: Package extension
        run: |
          cd dist-firefox && zip -r ../alphabetsoup-firefox.zip . \
            --exclude "*.map"

      - name: Upload to Firefox Add-ons (AMO)
        uses: browser-actions/release-firefox-addon@latest
        with:
          addon-id: alphabetsoup@hearnetech.com
          addon-path: alphabetsoup-firefox.zip
          auth-api-issuer: ${{ secrets.AMO_API_KEY }}
          auth-api-secret: ${{ secrets.AMO_API_SECRET }}
